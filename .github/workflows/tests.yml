name: MOLOCH Tests

# Unit-Tests ohne Hardware. Alles, was Pi, NPU, Kamera, Mikrofon oder Qdrant
# braucht, ueberspringt sich selbst (pytest-Marker / skip).
# Ersetzt NICHT moloch_audit.py auf dem Pi.

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    name: pytest (ohne Hardware)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'   # wie auf dem Pi (Python 3.13)

      - name: Abhaengigkeiten
        run: python -m pip install --quiet numpy requests pytest

      - name: Syntax aller Python-Dateien in core/ und scripts/
        run: python -m compileall -q core scripts mcp

      - name: Tests
        run: python -m pytest tests pc -q -p no:cacheprovider
