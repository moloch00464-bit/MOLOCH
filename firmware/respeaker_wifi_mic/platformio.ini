; M.O.L.O.C.H. — ReSpeaker Lite WiFi-Mic Firmware

[platformio]
src_dir = respeaker_wifi_mic

; ESP32-S3 (XIAO) + XMOS XU316 I2S Bridge
; PlatformIO Build-Config

[env:xiao_esp32s3]
platform = espressif32 @ ^6.5.0
board = seeed_xiao_esp32s3
framework = arduino

monitor_speed = 115200
upload_speed = 921600
upload_port = /dev/ttyACM0

board_build.arduino.memory_type = qio_opi
board_build.partitions = default_8MB.csv
build_src_dir = respeaker_wifi_mic

build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DBOARD_HAS_PSRAM
    -DCORE_DEBUG_LEVEL=0

lib_deps =
    adafruit/Adafruit NeoPixel @ ^1.12.0

; OTA-Update via WiFi (kein USB noetig)
; Aufruf: platformio run -e ota --target upload
[env:ota]
platform = espressif32 @ ^6.5.0
board = seeed_xiao_esp32s3
framework = arduino

board_build.arduino.memory_type = qio_opi
board_build.partitions = default_8MB.csv
build_src_dir = respeaker_wifi_mic

build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DBOARD_HAS_PSRAM
    -DCORE_DEBUG_LEVEL=0

upload_protocol = espota
upload_port = 10.42.0.2
upload_flags =
    --auth=m0l0ch_ota

lib_deps =
    adafruit/Adafruit NeoPixel @ ^1.12.0
