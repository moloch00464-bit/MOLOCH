[Journal]
# Pi-Default ist Storage=volatile (in /usr/lib/systemd/journald.conf.d/40-rpi-volatile-storage.conf)
# -> Logs sind nach jedem Reboot weg, kein Crash-Forensik moeglich.
# Override: persistent in /var/log/journal mit 200M Limit.
Storage=persistent
SystemMaxUse=200M

# Install:
#   sudo cp scripts/journald-persistent.conf /etc/systemd/journald.conf.d/persistent.conf
#   sudo mkdir -p /var/log/journal
#   sudo systemctl restart systemd-journald
#   sudo journalctl --flush
#
# Verify:
#   journalctl --list-boots   # mehrere Boots sollten gelistet werden ueber Zeit
#   ls -la /var/log/journal/$(cat /etc/machine-id)/
