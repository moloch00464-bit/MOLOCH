<!doctype html>
<html lang="de"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>MOLOCH KI-Zentrale</title>
<style>
:root{--bg:#0a0a0d;--fg:#e6e6ee;--mute:#80808f;--card:#13131a;--card2:#181820;
  --border:#26262f;--ok:#5dc36b;--warn:#e6b84d;--err:#ff7676;
  --pc:#9a5ce6;--pi:#4a86e0;--brain:#56b3a8}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font:14px/1.45 system-ui,"Segoe UI",sans-serif;
  display:flex;flex-direction:column;padding:12px;gap:10px}
button{font:inherit;cursor:pointer}
header{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
header h1{font:700 16px system-ui;letter-spacing:1.5px;margin-right:6px}
header h1 span{color:var(--pc)}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:12px;
  background:var(--card);border:1px solid var(--border);font-size:12px;white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;background:var(--mute);flex:none}
.dot.ok{background:var(--ok);box-shadow:0 0 6px var(--ok)}
.dot.warn{background:var(--warn)}.dot.err{background:var(--err)}
.spacer{flex:1}
a.nav{color:var(--mute);font-size:12px;text-decoration:none;border:1px solid var(--border);
  padding:3px 10px;border-radius:12px}
a.nav:hover{color:var(--fg);border-color:var(--mute)}
main{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 400px;gap:10px}
.card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:12px;min-width:0}
.card h2{font:600 11.5px system-ui;color:var(--mute);text-transform:uppercase;letter-spacing:.6px;
  margin-bottom:10px;display:flex;align-items:center;gap:8px}
.side{display:flex;flex-direction:column;gap:10px;min-height:0;overflow-y:auto}

/* Chat */
.chat{display:flex;flex-direction:column;min-height:0}
#log{flex:1;min-height:200px;overflow-y:auto;display:flex;flex-direction:column;gap:8px;padding:4px 2px 8px}
.msg{max-width:80%;padding:8px 12px;border-radius:12px;background:var(--card2);border:1px solid var(--border)}
.msg.markus{align-self:flex-end;background:#1d1a26;border-color:#3a2d55}
.msg.moloch{align-self:flex-start}
.msg.system{align-self:center;background:none;border:none;color:var(--mute);font-size:12px;max-width:100%}
.msg .meta{font-size:11px;color:var(--mute);margin-bottom:2px}
.msg .meta b{color:var(--fg);font-weight:600}
.msg.moloch .meta b{color:var(--brain)}
.msg .body{white-space:pre-wrap;word-break:break-word}
.msg .tail{font-size:10.5px;color:var(--mute);margin-top:4px}
.msg.thinking .body::after{content:"▍";animation:blink 1s infinite;color:var(--brain)}
@keyframes blink{50%{opacity:0}}
.controls{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:8px}
.seg{display:inline-flex;border:1px solid var(--border);border-radius:8px;overflow:hidden}
.seg button{background:none;border:none;color:var(--mute);padding:5px 12px;font-size:12px}
.seg button.on{background:#202030;color:var(--fg)}
.toggle{background:none;border:1px solid var(--border);color:var(--mute);padding:5px 12px;border-radius:8px;font-size:12px}
.toggle.on{color:var(--ok);border-color:#2f5a35}
.hint{font-size:11.5px;color:var(--mute)}
.inrow{display:flex;gap:8px}
#input{flex:1;min-width:0;background:var(--bg);border:1px solid var(--border);color:var(--fg);
  padding:10px 12px;border-radius:8px;font:14px system-ui;outline:none}
#input:focus{border-color:#4a4a5a}
.btn{background:#1d2a20;border:1px solid #2f5a35;color:var(--ok);padding:8px 16px;border-radius:8px;white-space:nowrap}
.btn:hover{border-color:var(--ok)}
.btn:disabled{opacity:.45;cursor:default}
.btn.stop{background:#2a1616;border-color:#5a2a2a;color:var(--err)}
.btn.mic{background:#18202e;border-color:#2a3f60;color:#79a6f0;padding:8px 12px}
.btn.mic.rec{background:#3a1414;border-color:var(--err);color:var(--err);animation:blink 1s infinite}
#micstatus{margin-top:6px;min-height:16px}

/* Zustand */
.zone{display:inline-block;padding:2px 10px;border-radius:10px;font:700 11px system-ui;letter-spacing:.5px}
.zone.guardian{background:#17284a;color:#79a6f0}
.zone.shadow{background:#2a1a4a;color:#b090f0}
.zone.berserker{background:#4a1a1a;color:#ff9090}
.meter{margin:7px 0}
.meter .lbl{display:flex;justify-content:space-between;font-size:12px;color:var(--mute)}
.meter .lbl b{color:var(--fg);font-weight:500;font-variant-numeric:tabular-nums}
.bar{height:6px;background:var(--bg);border-radius:3px;position:relative;margin-top:3px;overflow:hidden}
.bar i{position:absolute;top:0;bottom:0;border-radius:3px}
.bar.center::before{content:"";position:absolute;left:50%;top:-2px;bottom:-2px;width:1px;background:var(--border)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;font-size:12.5px;margin-top:8px}
.kv .k{color:var(--mute)}.kv .v{text-align:right;font-variant-numeric:tabular-nums}

/* Motor */
.motorhead{display:flex;gap:8px;align-items:center;margin-bottom:10px;flex-wrap:wrap}
.model{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 8px;padding:8px 0;border-top:1px solid var(--border)}
.model .n{font-weight:600;font-size:13px;word-break:break-all}
.model .n .star{color:var(--brain)}
.model .r{font-size:11.5px;color:var(--mute);grid-column:1}
.model .st{font-size:11px;grid-column:1;color:var(--mute)}
.model .st.on{color:var(--ok)}
.model button{grid-row:1/4;grid-column:2;align-self:center;background:none;border:1px solid var(--border);
  color:var(--fg);padding:4px 10px;border-radius:6px;font-size:12px;min-width:84px}
.model button:hover{border-color:var(--mute)}
.model button:disabled{opacity:.45;cursor:default}
.envwarn{font-size:11.5px;color:var(--warn);margin-top:8px}
.brow{display:grid;grid-template-columns:130px 1fr;gap:8px;align-items:center;margin:5px 0;font-size:12.5px}
.brow label{color:var(--mute)}.brow label b{color:var(--fg);font-weight:500}
.brow select{background:var(--bg);color:var(--fg);border:1px solid var(--border);border-radius:6px;padding:4px 6px;font:inherit}
.brow input[type=range]{width:100%;accent-color:var(--pc)}
.ramline{font-size:12px;color:var(--mute);margin-top:4px}

@media (max-width:900px){
  body{height:auto}
  main{grid-template-columns:1fr}
  #log{min-height:50vh}
  .msg{max-width:92%}
}
</style></head>
<body>
<header>
  <h1>MOLOCH <span>KI-ZENTRALE</span></h1>
  <span class="pill"><span class="dot" id="p-ollama"></span><span id="t-ollama">Ollama …</span></span>
  <span class="pill"><span class="dot" id="p-brain"></span><span id="t-brain">Hirn …</span></span>
  <span class="pill"><span class="dot" id="p-pi"></span><span id="t-pi">Pi …</span></span>
  <span class="pill" id="t-ram">RAM …</span>
  <span class="spacer"></span>
  <a class="nav" href="/">Dashboard →</a>
</header>

<main>
  <section class="card chat">
    <h2>Mit Moloch reden</h2>
    <div id="log"></div>
    <div class="controls">
      <div class="seg" id="mode">
        <button data-mode="local" class="on" title="Antwort kommt direkt vom PC-Hirn (Ollama, lokal)">PC-Hirn lokal</button>
        <button data-mode="pi" title="Wie bisher: der Pi entscheidet, welches Modell antwortet (auch Cloud möglich)">über den Pi</button>
      </div>
      <button class="toggle" id="tts">Sprache aus</button>
      <span class="hint" id="modehint">Lokal: Persona und Live-Zustand vom Pi, Antwort vom PC.</span>
    </div>
    <div class="inrow">
      <button class="btn mic" id="mic" title="Sprechen (Whisper auf dem PC)">🎤</button>
      <input id="input" placeholder="Schreib Moloch was …" autocomplete="off">
      <button class="btn" id="send">Senden</button>
    </div>
    <div class="hint" id="micstatus"></div>
  </section>

  <aside class="side">
    <section class="card">
      <h2>Moloch jetzt <span class="zone" id="zone">—</span></h2>
      <div class="meter"><div class="lbl">Anspannung<b id="v-tension">—</b></div>
        <div class="bar center"><i id="b-tension"></i></div></div>
      <div class="meter"><div class="lbl">Dominanz<b id="v-dom">—</b></div>
        <div class="bar center"><i id="b-dom"></i></div></div>
      <div class="meter"><div class="lbl">Präsenz<b id="v-pres">—</b></div>
        <div class="bar"><i id="b-pres"></i></div></div>
      <div class="kv">
        <span class="k">Im Bild</span><span class="v" id="v-seen">—</span>
        <span class="k">Tageszeit</span><span class="v" id="v-time">—</span>
        <span class="k">Kamera</span><span class="v" id="v-fps">—</span>
      </div>
    </section>

    <section class="card">
      <h2>KI-Motor (Ollama)</h2>
      <div class="motorhead">
        <button class="btn" id="ollama-btn">…</button>
        <span class="hint" id="ollama-info"></span>
      </div>
      <div id="models"></div>
      <div class="ramline" id="ramline"></div>
      <div class="envwarn" id="envwarn"></div>
    </section>

    <section class="card">
      <h2>Körper (Reachy-Mini-Simulator) <span class="dot" id="p-body"></span></h2>
      <div class="motorhead">
        <button class="btn" id="body-btn">…</button>
        <button class="toggle" id="body-estop" style="display:none">Not-Aus</button>
        <span class="hint" id="body-info"></span>
      </div>
      <div id="body-panel" style="display:none">
        <div class="seg" id="body-src" style="margin-bottom:8px">
          <button data-src="live" class="on">Live von Moloch</button>
          <button data-src="test">Ausprobieren</button>
        </div>
        <div class="kv" id="body-now"></div>
        <div id="body-gaze" style="margin-top:8px">
          <button class="toggle" id="body-center" title="Setzt die aktuelle Kamerastellung als Geradeaus-Blick des Roboters">Kamera schaut auf mich</button>
          <div class="brow"><label>Mitdrehen <b id="bg-faktor-v">1.0</b>×</label><input type="range" id="bg-faktor" min="0.5" max="3" step="0.1" value="1"></div>
        </div>
        <div id="body-test" style="display:none;margin-top:8px">
          <div class="brow"><label>Zone</label><select id="bt-zone"></select></div>
          <div class="brow"><label>Stimmung</label><select id="bt-mood"></select></div>
          <div class="brow"><label>Zustand</label><select id="bt-being_state"></select></div>
          <div class="brow"><label>Anspannung <b id="bt-tension-v">0.0</b></label><input type="range" id="bt-tension" min="0" max="1" step="0.05" value="0"></div>
          <div class="brow"><label>Dominanz <b id="bt-dominance-v">0.0</b></label><input type="range" id="bt-dominance" min="-1" max="1" step="0.05" value="0"></div>
        </div>
      </div>
    </section>
  </aside>
</main>

<script>
const $ = id => document.getElementById(id);
let mode = 'local', speaking = false, busy = false, abortCtl = null, lastState = null;
let ttsOn = false;
try { ttsOn = localStorage.getItem('zentrale.tts') === '1'; mode = localStorage.getItem('zentrale.mode') || 'local'; } catch (e) {}

function timeStr(ts) {
  const d = ts ? new Date(ts) : new Date();
  return d.toLocaleTimeString('de-DE', {hour: '2-digit', minute: '2-digit'});
}

function addMsg(who, text, meta, cls) {
  const el = document.createElement('div');
  el.className = 'msg ' + (cls || who);
  if (who !== 'system') {
    const m = document.createElement('div');
    m.className = 'meta';
    const b = document.createElement('b');
    b.textContent = who === 'markus' ? 'Markus' : 'Moloch';
    m.append(b, ' · ' + (meta || timeStr()));
    el.append(m);
  }
  const body = document.createElement('div');
  body.className = 'body';
  body.textContent = text;
  el.append(body);
  $('log').append(el);
  $('log').scrollTop = $('log').scrollHeight;
  return el;
}

function addTail(el, text) {
  const t = document.createElement('div');
  t.className = 'tail';
  t.textContent = text;
  el.append(t);
}

async function loadVerlauf() {
  try {
    const d = await (await fetch('/api/ki/verlauf?n=40')).json();
    $('log').innerHTML = '';
    if (!d.messages.length) addMsg('system', 'Noch kein Gespräch. Schreib Moloch was.');
    for (const e of d.messages) {
      const via = e.mode === 'pi' ? 'über Pi' : 'lokal';
      const el = addMsg(e.who === 'markus' ? 'markus' : 'moloch', e.text, timeStr(e.ts) + ' · ' + via);
      if (e.who !== 'markus' && e.model) addTail(el, e.model + (e.secs ? ' · ' + e.secs + ' s' : ''));
    }
  } catch (e) { addMsg('system', 'Verlauf nicht ladbar: ' + e.message); }
}

function setMode(m) {
  mode = m;
  try { localStorage.setItem('zentrale.mode', m); } catch (e) {}
  for (const b of $('mode').querySelectorAll('button')) b.classList.toggle('on', b.dataset.mode === m);
  $('modehint').textContent = m === 'local'
    ? 'Lokal: Persona und Live-Zustand vom Pi, Antwort vom PC.'
    : 'Über den Pi: der Pi wählt das Modell, das kann auch DeepSeek (Cloud) sein.';
}
$('mode').addEventListener('click', e => { if (e.target.dataset.mode) setMode(e.target.dataset.mode); });

function setTts(on) {
  ttsOn = on;
  try { localStorage.setItem('zentrale.tts', on ? '1' : '0'); } catch (e) {}
  $('tts').textContent = on ? 'Sprache an' : 'Sprache aus';
  $('tts').classList.toggle('on', on);
  if (!on && window.speechSynthesis) speechSynthesis.cancel();
}
$('tts').onclick = () => setTts(!ttsOn);

function speak(text) {
  if (!ttsOn || !window.speechSynthesis || !text) return;
  const m = (lastState && lastState.moloch) || {};
  const zone = m.zone || 'guardian', ten = m.tension || 0;
  const u = new SpeechSynthesisUtterance(text.replace(/\s+/g, ' '));
  u.lang = 'de-DE';
  u.pitch = {guardian: 1.0, shadow: 0.82, berserker: 1.15}[zone] || 1.0;
  u.rate = Math.max(0.6, Math.min(1.6, ({guardian: .95, shadow: .88, berserker: 1.2}[zone] || .95) + ten * 0.15));
  const v = speechSynthesis.getVoices().find(v => v.lang.startsWith('de'));
  if (v) u.voice = v;
  speechSynthesis.speak(u);
}

function setBusy(b) {
  busy = b;
  $('send').textContent = b ? 'Stopp' : 'Senden';
  $('send').classList.toggle('stop', b);
}

async function send() {
  if (busy) { if (abortCtl) abortCtl.abort(); return; }
  const text = $('input').value.trim();
  if (!text) return;
  $('input').value = '';
  if (window.speechSynthesis) speechSynthesis.cancel();
  addMsg('markus', text, timeStr() + (mode === 'pi' ? ' · über Pi' : ' · lokal'));
  const el = addMsg('moloch', '', timeStr(), 'moloch thinking');
  const body = el.querySelector('.body');
  setBusy(true);
  abortCtl = new AbortController();
  try {
    const r = await fetch('/api/ki/chat', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({message: text, mode}), signal: abortCtl.signal,
    });
    if (mode === 'pi' || !r.body || r.headers.get('content-type').includes('application/json')) {
      const d = await r.json();
      body.textContent = d.text || ('[' + (d.error || 'keine Antwort') + ']');
      if (d.provider || d.secs) addTail(el, (d.provider || '') + (d.secs ? ' · ' + d.secs + ' s' : ''));
      speak(d.text);
    } else {
      const reader = r.body.getReader(), dec = new TextDecoder();
      let buf = '', full = '';
      for (;;) {
        const {value, done} = await reader.read();
        if (done) break;
        buf += dec.decode(value, {stream: true});
        let i;
        while ((i = buf.indexOf('\n')) >= 0) {
          const line = buf.slice(0, i); buf = buf.slice(i + 1);
          if (!line.trim()) continue;
          const d = JSON.parse(line);
          if (d.t) { full += d.t; body.textContent = full; $('log').scrollTop = $('log').scrollHeight; }
          if (d.error) body.textContent = (full ? full + '\n' : '') + '[' + d.error + ']';
          if (d.done) {
            const parts = [d.model, d.secs + ' s'];
            if (d.erstes_wort_s != null) parts.push('erstes Wort ' + d.erstes_wort_s + ' s');
            if (d.tok_s) parts.push(d.tok_s + ' Tok/s');
            if (d.laden_s > 1) parts.push('Modell geladen in ' + d.laden_s + ' s');
            parts.push(d.gedaechtnis ? 'im Gedächtnis' : 'nicht im Pi-Gedächtnis');
            if (d.erinnerungen == null) parts.push('Erinnerungen: Pi nicht erreichbar');
            else if (d.erinnerungen > 0) parts.push(d.erinnerungen + ' Erinnerung' + (d.erinnerungen > 1 ? 'en' : '') +
                                                   ' genutzt (' + (d.erinnerung_quellen || []).join(', ') + ')');
            else parts.push('keine passende Erinnerung');
            addTail(el, parts.join(' · '));
          }
        }
      }
      speak(full.trim());
    }
  } catch (e) {
    body.textContent = e.name === 'AbortError' ? (body.textContent || '') + ' [abgebrochen]' : '[Fehler: ' + e.message + ']';
  } finally {
    el.classList.remove('thinking');
    setBusy(false);
    abortCtl = null;
    $('input').focus();
  }
}
$('send').onclick = send;
$('input').addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); } });

// Mikrofon: Aufnahme -> /api/transcribe (Whisper-Bridge :9001) -> Text ins Feld, kein Auto-Senden
let rec = null, chunks = [];
$('mic').onclick = async () => {
  if (rec) { rec.stop(); return; }
  try {
    const stream = await navigator.mediaDevices.getUserMedia({audio: true});
    rec = new MediaRecorder(stream); chunks = [];
    rec.ondataavailable = e => { if (e.data.size) chunks.push(e.data); };
    rec.onstop = async () => {
      stream.getTracks().forEach(t => t.stop());
      rec = null; $('mic').classList.remove('rec'); $('mic').textContent = '🎤';
      $('micstatus').textContent = 'erkenne Sprache …';
      try {
        const r = await fetch('/api/transcribe', {method: 'POST', headers: {'Content-Type': 'audio/webm'},
          body: new Blob(chunks, {type: 'audio/webm'})});
        const d = await r.json();
        if (d.text && d.text.trim()) {
          $('input').value = d.text.trim(); $('input').focus();
          $('micstatus').textContent = 'Erkannt. Prüfen und Enter drücken.';
        } else $('micstatus').textContent = d.error ? 'Spracherkennung: ' + d.error : 'Nichts erkannt.';
      } catch (e) { $('micstatus').textContent = 'Spracherkennung nicht erreichbar: ' + e.message; }
    };
    if (window.speechSynthesis) speechSynthesis.cancel();
    rec.start(); $('mic').classList.add('rec'); $('mic').textContent = '⏹';
    $('micstatus').textContent = 'Aufnahme läuft, nochmal klicken zum Beenden.';
  } catch (e) { $('micstatus').textContent = 'Kein Mikrofonzugriff: ' + e.message; }
};

// Zustand
function meter(id, v, centered) {
  const bar = $('b-' + id);
  if (typeof v !== 'number') { bar.style.width = '0'; return; }
  const c = v > 0.6 ? 'var(--err)' : v > 0.2 ? 'var(--warn)' : 'var(--ok)';
  if (centered) {
    const x = Math.max(-1, Math.min(1, v));
    bar.style.left = (x >= 0 ? 50 : 50 + x * 50) + '%';
    bar.style.width = Math.abs(x) * 50 + '%';
  } else { bar.style.left = '0'; bar.style.width = Math.max(0, Math.min(1, v)) * 100 + '%'; }
  bar.style.background = id === 'tension' ? c : 'var(--pi)';
}
const num = v => typeof v === 'number' ? (v >= 0 ? '+' : '') + v.toFixed(2) : '—';
function dot(id, cls) { $(id).className = 'dot ' + cls; }

async function modelAction(name, action, btn) {
  btn.disabled = true; btn.textContent = action === 'load' ? 'lädt …' : 'entlädt …';
  try {
    const d = await (await fetch('/api/ki/model', {method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({model: name, action})})).json();
    $('ollama-info').textContent = d.error ? d.error : name + (action === 'load' ? ' geladen' : ' entladen') + ' (' + d.sekunden + ' s)';
  } catch (e) { $('ollama-info').textContent = e.message; }
  refresh();
}

async function ollamaAction(action) {
  if (action === 'stop' && !confirm('Ollama stoppen? Dann antwortet auch der Pi-Tentakel nicht mehr vom PC.')) return;
  const b = $('ollama-btn'); b.disabled = true; b.textContent = action === 'start' ? 'startet …' : 'stoppt …';
  try {
    const d = await (await fetch('/api/ki/ollama', {method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({action})})).json();
    $('ollama-info').textContent = d.error || d.info;
  } catch (e) { $('ollama-info').textContent = e.message; }
  b.disabled = false; refresh();
}

function render(s) {
  lastState = s;
  const o = s.ollama;
  dot('p-ollama', o.online ? 'ok' : 'err');
  $('t-ollama').textContent = o.online ? 'Ollama ' + o.version : 'Ollama aus';
  const brain = s.modelle.find(m => m.haupthirn);
  dot('p-brain', !s.haupthirn_installiert ? 'err' : brain && brain.geladen ? (s.denkt ? 'warn' : 'ok') : 'warn');
  $('t-brain').textContent = 'Hirn ' + s.haupthirn + (s.denkt ? ' · denkt' : brain && brain.geladen ? ' · warm' : ' · kalt');
  const m = s.moloch;
  dot('p-pi', m.online ? 'ok' : 'err');
  $('t-pi').textContent = m.online ? 'Pi online' : 'Pi offline';
  $('t-ram').textContent = 'RAM ' + s.system.ram_belegt_gb + ' / ' + s.system.ram_gesamt_gb + ' GB · CPU ' + Math.round(s.system.cpu_prozent) + ' %';

  const z = m.zone || '—';
  $('zone').textContent = z.toUpperCase(); $('zone').className = 'zone ' + z;
  $('v-tension').textContent = num(m.tension); meter('tension', m.tension, true);
  $('v-dom').textContent = num(m.dominance); meter('dom', m.dominance, true);
  $('v-pres').textContent = typeof m.presence === 'number' ? Math.round(m.presence * 100) + ' %' : '—'; meter('pres', m.presence, false);
  $('v-seen').textContent = !m.online ? '—' : m.gesicht ? m.gesicht : m.person ? 'Person, unbekannt' : 'niemand';
  $('v-time').textContent = m.tageszeit || '—';
  $('v-fps').textContent = typeof m.fps === 'number' ? m.fps.toFixed(1) + ' FPS' : '—';

  const b = $('ollama-btn');
  if (!b.disabled || b.textContent === '…') {
    b.disabled = false;
    b.textContent = o.online ? 'Ollama stoppen' : 'Ollama starten';
    b.className = 'btn' + (o.online ? ' stop' : '');
    b.onclick = () => ollamaAction(o.online ? 'stop' : 'start');
  }

  const box = $('models');
  box.innerHTML = '';
  if (!o.online) { box.innerHTML = '<div class="hint">Ollama läuft nicht. Starten, dann erscheinen die Modelle.</div>'; }
  let ram = 0;
  for (const md of s.modelle) {
    ram += md.ram_gb;
    const row = document.createElement('div'); row.className = 'model';
    const n = document.createElement('div'); n.className = 'n';
    if (md.haupthirn) { const st = document.createElement('span'); st.className = 'star'; st.textContent = '★ '; n.append(st); }
    n.append(md.name);
    const r = document.createElement('div'); r.className = 'r';
    r.textContent = md.rolle + (md.aufgabe ? ' · ' + md.aufgabe : '');
    const st = document.createElement('div'); st.className = 'st' + (md.geladen ? ' on' : '');
    st.textContent = md.geladen ? 'im RAM · ' + md.ram_gb + ' GB' : 'auf Platte · ' + md.groesse_gb + ' GB' + (md.parameter ? ' · ' + md.parameter : '');
    const btn = document.createElement('button');
    btn.textContent = md.geladen ? 'Entladen' : 'Laden';
    btn.onclick = () => modelAction(md.name, md.geladen ? 'unload' : 'load', btn);
    row.append(n, btn, r, st);
    box.append(row);
  }
  $('ramline').textContent = o.online ? 'Modelle im RAM: ' + ram.toFixed(1) + ' GB · Platte frei: ' + s.system.platte_frei_gb + ' GB' : '';

  const env = o.env || {};
  const val = k => env[k] ? (env[k].benutzer || env[k].system) : null;
  const miss = [];
  if (val('OLLAMA_NUM_GPU') !== '0') miss.push('NUM_GPU=0');
  if (!val('OLLAMA_MAX_LOADED_MODELS')) miss.push('MAX_LOADED_MODELS');
  if (!val('OLLAMA_NUM_PARALLEL')) miss.push('NUM_PARALLEL');
  $('envwarn').textContent = miss.length ? 'Noch nicht eingestellt: ' + miss.join(', ') + '. Setup-Skript ausführen.' : '';
}

async function refresh() {
  try { render(await (await fetch('/api/ki/status')).json()); }
  catch (e) { dot('p-ollama', 'err'); $('t-ollama').textContent = 'Zentrale nicht erreichbar'; }
}

// Koerper (Reachy-Simulator)
let bodySrc = 'live', bodyListsDone = false, bodyBusy = false;
async function bodyPost(payload) {
  const d = await (await fetch('/api/ki/body', {method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify(payload)})).json();
  if (d.error || d.info) $('body-info').textContent = d.error || d.info;
  return d;
}
function sendBodyTest() {
  if (bodySrc !== 'test') return;
  bodyPost({action: 'test', zone: $('bt-zone').value, mood: $('bt-mood').value,
    being_state: $('bt-being_state').value, tension: +$('bt-tension').value, dominance: +$('bt-dominance').value});
}
function setBodySrc(src) {
  bodySrc = src;
  for (const b of $('body-src').querySelectorAll('button')) b.classList.toggle('on', b.dataset.src === src);
  $('body-test').style.display = src === 'test' ? '' : 'none';
  if (src === 'test') sendBodyTest(); else bodyPost({action: 'live'});
}
$('body-src').addEventListener('click', e => { if (e.target.dataset.src) setBodySrc(e.target.dataset.src); });
for (const id of ['zone', 'mood', 'being_state']) $('bt-' + id).addEventListener('change', sendBodyTest);
for (const id of ['tension', 'dominance']) $('bt-' + id).addEventListener('input', () => {
  $('bt-' + id + '-v').textContent = (+$('bt-' + id).value).toFixed(2); sendBodyTest(); });

$('body-center').onclick = () => bodyPost({action: 'center'});
$('bg-faktor').addEventListener('change', () => bodyPost({action: 'faktor', wert: +$('bg-faktor').value}));
$('bg-faktor').addEventListener('input', () => { $('bg-faktor-v').textContent = (+$('bg-faktor').value).toFixed(1); });

async function refreshBody() {
  let s;
  try { s = await (await fetch('/api/ki/body')).json(); } catch (e) { return; }
  if (!bodyListsDone) {
    for (const k of ['zone', 'mood', 'being_state'])
      for (const v of s.listen[k]) { const o = document.createElement('option'); o.textContent = v; $('bt-' + k).append(o); }
    bodyListsDone = true;
  }
  const b = s.bruecke, on = s.simulator && !!b;
  dot('p-body', on ? (b.estop ? 'err' : 'ok') : s.simulator ? 'warn' : '');
  const btn = $('body-btn');
  if (!bodyBusy) {
    btn.textContent = !s.installiert ? 'nicht installiert' : s.simulator ? 'Simulator stoppen' : 'Simulator starten';
    btn.disabled = !s.installiert;
    btn.className = 'btn' + (s.simulator ? ' stop' : '');
    btn.onclick = async () => {
      bodyBusy = true; btn.disabled = true; btn.textContent = s.simulator ? 'stoppt …' : 'startet …';
      try { await bodyPost({action: s.simulator ? 'stop' : 'start'}); } catch (e) { $('body-info').textContent = e.message; }
      bodyBusy = false; refreshBody();
    };
  }
  $('body-panel').style.display = on ? '' : 'none';
  const es = $('body-estop');
  es.style.display = on ? '' : 'none';
  if (on) {
    es.textContent = b.estop ? 'Not-Aus lösen' : 'Not-Aus';
    es.classList.toggle('on', !b.estop);
    es.onclick = () => bodyPost({action: 'estop', on: !b.estop}).then(refreshBody);
    const z = b.zustand, p = b.last_pose || {};
    const rows = [['Quelle', b.quelle === 'live' ? 'Molochs Live-Zustand' : b.quelle === 'test' ? 'Test-Vorgabe' : 'Pi offline'],
      ['Reaktion', z.ereignis ? ({markus_arrived: 'Markus kommt', markus_left: 'Markus geht', unknown_person: 'Unbekannter', spontan: 'spontaner Satz'}[z.ereignis] || z.ereignis) + (z.speaking ? ' · spricht' : '') : '—'],
      ['Zone / Stimmung', z.zone + ' / ' + z.mood], ['Zustand', z.being_state],
      ['Blick', z.gaze_yaw == null ? '—' : 'Drehung ' + z.gaze_yaw.toFixed(0) + '°, Neigung ' + (z.gaze_pitch ?? 0).toFixed(0) + '°'],
      ['Kopf', 'Neigung ' + (p.head_pitch ?? '—') + '°, Höhe ' + (p.head_z ?? '—') + ' mm'],
      ['Antennen', (p.antenna_l ?? '—') + '° / ' + (p.antenna_r ?? '—') + '°']];
    const box = $('body-now'); box.innerHTML = '';
    for (const [k, v] of rows) {
      const a = document.createElement('span'); a.className = 'k'; a.textContent = k;
      const c = document.createElement('span'); c.className = 'v'; c.textContent = v;
      box.append(a, c);
    }
  }
}
refreshBody(); setInterval(refreshBody, 2000);

setMode(mode); setTts(ttsOn);
loadVerlauf(); refresh(); setInterval(refresh, 4000);
$('input').focus();
</script>
